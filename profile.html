<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Page</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #333;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    .header-links {
      display: flex;
      gap: 15px;
    }
    .header-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    .header-links a:hover {
      color: #00aced;
    }

    /* Main Content */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .profile-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
    .profile-card h2 {
      margin: 10px 0;
      font-size: 22px;
    }
    .profile-card p {
      margin: 8px 0;
      font-size: 16px;
      color: #555;
    }

    /* Footer */
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
    .social-icons a {
      color: white;
      margin: 0 10px;
      font-size: 22px;
      transition: color 0.3s;
    }
    .social-icons a:hover {
      color: #00aced;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>My Profile</h1>
    <div class="header-links">
      <a href="#">Sign Up</a>
      <a href="#">Login</a>
    </div>
  </header>

  <!-- Main Profile Section -->
  <main>
    <div class="profile-card">
      <img src="https://via.placeholder.com/120" alt="Profile Image">
      <h2>Rushmitha Tamma</h2>
      <p><strong>Mobile:</strong> +91-9876543210</p>
      <p><strong>Email:</strong> rushmitha@example.com</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="social-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>
