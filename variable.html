</head>
<body>
    fuction myFunction() {
        var x = 10;
        document.write(x + "<br>"); // Outputs: 10
        if (true) {
            var x = 20; // This will change the outer x
            document.write(x + "<br>"); // Outputs: 20
        }
        document.write(x + "<br>"); // Outputs: 20, due to variable hoisting
    }
